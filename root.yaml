apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  creationTimestamp: null
  labels:
    app.kubernetes.io/name: root
  name: root
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: argoproj.io
      jsonPointers:
        - /status
      kind: Application
  project: default
  sources:
  - repoURL: https://github.com/akolpakova/demo-argocd.git
    path: renderers/clusters
    targetRevision: test-team
    helm:
      valueFiles:
      - /argocd-production/config.yaml
      - /clusters/clusters-list.yaml

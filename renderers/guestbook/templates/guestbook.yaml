apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook
spec:
  goTemplate: true
  generators:
  - list:
      elements:
        - cluster: "engineering-dev" # Ensure strings are quoted
          url: "https://kubernetes.default.svc"
  template:
    metadata:
      name: '{{`{{ .cluster }}`}}-guestbook'
    spec:
      project: "default"
      source:
        repoURL: https://github.com/argoproj/argo-cd.git
        targetRevision: HEAD
        path: 'applicationset/examples/template-override/{{`{{ .cluster }}`}}-override'
      destination:
        server: '{{`{{ .url }}`}}'
        namespace: guestbook
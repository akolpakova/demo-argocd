apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook
spec:
  goTemplate: true # ✅ Correct
  generators:
  - list:
      elements:
        - cluster: engineering-dev
          url: https://kubernetes.default.svc
  template:
    metadata:
      name: '{{ .cluster }}-guestbook' # ✅ Correct Go Template syntax
    spec:
      project: "default"
      source:
        repoURL: https://github.com/argoproj/argo-cd.git
        targetRevision: HEAD
        # Accessing variables in Go Template style
        path: 'applicationset/examples/template-override/{{ .cluster }}-override'
      destination:
        server: '{{ .url }}' # ✅ Correct Go Template syntax
        namespace: guestbook
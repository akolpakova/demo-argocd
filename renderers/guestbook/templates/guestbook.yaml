apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook
spec:
  goTemplate: true
  generators:
  - list:
      elements:
        - cluster: engineering-dev
          url: https://kubernetes.default.svc
          prune: true  # ✅ Define the value here
  template:
    metadata:
      name: '{{`{{ .cluster }}`}}-guestbook'
    spec:
      project: default
      source:
        repoURL: https://github.com/argoproj/argo-cd.git
        targetRevision: HEAD
        path: 'applicationset/examples/template-override/{{`{{ .cluster }}`}}-override'
      destination:
        server: '{{`{{ .url }}`}}'
        namespace: guestbook
  # ✅ templatePatch added below
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          prune: {{`{{ .prune }}`}}
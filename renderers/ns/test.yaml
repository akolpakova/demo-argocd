apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
  name: parent-safe-app-01
  namespace: argocd
  # finalizers:
  #   - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/akolpakova/demo-argocd.git
    targetRevision: test-team
    # Path to the directory containing your Namespace manifest
    path: namespaces
    # directory:
    #   include: storm.yaml
  destination:
    server: https://kubernetes.default.svc
    # The namespace where ArgoCD creates the Application object
    namespace: argocd 
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # ✅ This is the core setting to orphan resources
      # - PreserveResourcesOnDeletion=true 
      - CreateNamespace=true
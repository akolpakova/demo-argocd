{{- range $key,$val := .Values.resourceKinds }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  {{- if eq $.Values.isDecomissioned true }}    
  finalizers:
      - resources-finalizer.argocd.argoproj.io
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $val.syncWave | quote}}
    argocd.argoproj.io/managed-by-url: {{ $.Values.argocdURL }}  
    {{- if eq $.Values.isDecomissioned false }}
    argocd.argoproj.io/sync-options: Delete=false
    {{- end }}
  name: {{ $.Values.clusterName }}-{{ $key }}
  namespace: {{ $.Values.argocdNamespace }}
spec:
  {{- if eq $.Values.isDecomissioned false }}
  syncPolicy:
    preserveResourcesOnDeletion: true
  {{- end }}
  generators:
    - git:
        repoURL: {{ $.Values.repoUrl}}
        revision: {{ $.Values.targetRevision}}
        directories:
        - path: clusters/{{ $.Values.clusterName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: argocd-autopilot
        app.kubernetes.io/name: '{{"{{"}} path.basename{{"}}"}}-{{ $key }}'
      name: '{{"{{"}} path.basename {{"}}"}}-{{ $key }}'
      namespace: {{ $.Values.argocdNamespace }} 
    spec:
      destination:
        namespace: {{ $.Values.clusterName }}
        server: https://kubernetes.default.svc
      ignoreDifferences:
      - group: argoproj.io
        jsonPointers:
        - /status
        kind: Application
      project: default
      sources:
      - repoURL: {{ $.Values.repoUrl}}
        path: renderers/groups
        targetRevision: {{ $.Values.targetRevision}}
        helm:
          parameters:
          - name: "isDecomissioned"
            value: "{{ $.Values.isDecomissioned }}"
          - name: "groupName"
            value: {{ $key }}
          - name: "enableAutoSync"
            value: "{{ $val.enableAutoSync }}"
          - name: "autoSyncPrune"
            value: "{{ $val.autoSyncPrune }}"
          valueFiles:
          - $values/argocd-{{ $.Values.argocdInstanceType }}/config.yaml
          - $values/clusters/{{ $.Values.clusterName }}/config.yaml
          # - $values/{{ $val.config }}
      - repoURL: {{ $.Values.repoUrl}}
        targetRevision: {{ $.Values.targetRevision}}
        ref: values
      syncPolicy:
        automated:
          enabled: {{ $val.enableAutoSync }}
        {{- if eq $.Values.isDecomissioned true }}
          prune: true
        {{- else }}
          prune: {{ $val.autoSyncPrune }}
        {{- end}}
        syncOptions:
          - CreateNamespace=true

---
{{- end }}

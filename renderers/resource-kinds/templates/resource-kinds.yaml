{{- $isDecommissioned := dig $.Values.clusterName "isDecommissioned" true $.Values.clusters -}}

{{- range $key,$val := .Values.resourceKinds }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  {{- if eq $isDecommissioned true }}   
  finalizers:
      - resources-finalizer.argocd.argoproj.io
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $val.syncWave | quote}}
    argocd.argoproj.io/managed-by-url: {{ $.Values.argocdURL }}  
    {{- if eq $isDecommissioned false }}
    argocd.argoproj.io/sync-options: Delete=false
    {{- end }}
  name: {{ $.Values.clusterName }}-{{ $key }}
  namespace: {{ $.Values.argocdNamespace }}
spec:
  goTemplate: true
  {{- if eq $isDecommissioned false }}
  syncPolicy:
    preserveResourcesOnDeletion: true
  {{- end }}
  generators:
    - git:
        repoURL: {{ $.Values.repoUrl}}
        revision: {{ $.Values.targetRevision}}
        directories:
        - path: clusters/{{ $.Values.clusterName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: argocd-autopilot
        app.kubernetes.io/name: '{{"{{"}} .path.basename{{"}}"}}-{{ $key }}'
      name: '{{"{{"}} .path.basename {{"}}"}}-{{ $key }}'
      namespace: {{ $.Values.argocdNamespace }} 
    spec:
      destination:
        namespace: {{ $.Values.clusterName }}
        server: https://kubernetes.default.svc
      ignoreDifferences:
      - group: argoproj.io
        jsonPointers:
        - /status
        kind: Application
      project: default
      sources:
      - repoURL: {{ $.Values.repoUrl}}
        path: renderers/groups
        targetRevision: {{ $.Values.targetRevision}}
        helm:
          parameters:
          - name: "debug-revision"
            value: '{{"{{"}} .revision{{"}}"}}'
          - name: "debug-path"
            value: '{{"{{"}} .path.path{{"}}"}}'
          - name: "debug-all-vars"
            value: "{{ . | toJson }}"
          - name: "isDecommissioned"
            value: "{{ $isDecommissioned }}"
          - name: "groupName"
            value: {{ $key }}
          - name: "enableAutoSync"
            value: "{{ $val.enableAutoSync }}"
          - name: "autoSyncPrune"
            value: "{{ $val.autoSyncPrune }}"
          valueFiles:
          - $values/argocd-{{ $.Values.argocdInstanceType }}/config.yaml
          - $values/clusters/{{ $.Values.clusterName }}/config.yaml
          # - $values/{{ $val.config }}
      - repoURL: {{ $.Values.repoUrl}}
        targetRevision: {{ $.Values.targetRevision}}
        ref: values
      syncPolicy:
        automated:
          enabled: {{ $val.enableAutoSync }}
        {{- if eq $isDecommissioned true }}
          prune: true
        {{- else }}
          prune: {{ $val.autoSyncPrune }}
        {{- end}}
        syncOptions:
          - CreateNamespace=true

---
{{- end }}

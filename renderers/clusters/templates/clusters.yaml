apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/managed-by-url: {{ $.Values.argocdURL }}  
    argocd.argoproj.io/sync-options: Delete=false
  creationTimestamp: null
  ## DO NOT CHANGE THE NAME FOR THE PRODUCTION ARGOCD
  name: clusters{{- if eq $.Values.argocdInstanceType "development" -}}-development{{- end }}
  namespace: {{ $.Values.argocdNamespace }} 
spec:
  generators:
  {{- range $clusterName,$clusterInfo := $.Values.clusters }}
  - git:
      directories:
      - path: 'clusters/{{ $clusterName }}'
      repoURL: https://github.com/akolpakova/demo-argocd.git
      requeueAfterSeconds: 20
      revision: {{ $.Values.targetRevision}}
  {{- end }}
  {{- if ne $.Values.decomission true }}
  syncPolicy:
    preserveResourcesOnDeletion: true
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: argocd-autopilot
      ## DO NOT CHANGE THE NAME
      name: '{{"{{"}} path.basename {{"}}"}}-cluster'
      namespace: {{ $.Values.argocdNamespace }} 
    spec:
      destination:
        namespace: {{ $.Values.argocdNamespace }} 
        server: https://kubernetes.default.svc
      ignoreDifferences:
      - group: argoproj.io
        jsonPointers:
        - /status
        kind: Application
      project: default
      sources:
        - repoURL: https://github.com/akolpakova/demo-argocd.git
          path: renderers/resource-kinds
          targetRevision: {{ $.Values.targetRevision}}
          helm:
            parameters:
            - name: "decomission"
              value: "{{ $.Values.decomission }}"
            valueFiles:
            - $values/argocd-{{ $.Values.argocdInstanceType }}/config.yaml
            - $values/{{"{{"}} path {{"}}"}}/config.yaml
        - repoURL: https://github.com/akolpakova/demo-argocd.git
          targetRevision: {{ $.Values.targetRevision}}
          ref: values
      syncPolicy:
        automated:
        {{- if eq $.Values.decomission true }}
          prune: true
        {{- else }}
          prune: false
        {{- end}}
          selfHeal: true
        syncOptions:
          - PreserveResourcesOnDeletion=true
status: {}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/managed-by-url: {{ $.Values.argocdURL }} 
    {{- if ne $.Values.decomission true }}
    argocd.argoproj.io/sync-options: Delete=confirm
    {{- end }}
  name: final-{{ $.Values.clusterName }}-{{ $.Values.groupName }}
  namespace: {{ $.Values.argocdNamespace }}
  # finalizers:
  #   - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
  {{- if eq $.Values.groupName "apps" }}
    repoURL: https://github.com/helm/examples.git
    targetRevision: main
    path: charts/hello-world
    helm:
      releaseName: {{ $.Values.clusterName }}-{{ $.Values.groupName }}
  {{- else if ne $.Values.groupName "apps" }}
    repoURL: https://github.com/akolpakova/demo-argocd.git
    targetRevision: test-team
    path: namespaces
    # directory:
    #   include: phoenix.yaml
    # {{- if eq $.Values.groupName "namespaces" }}      
    # extraSourceFields: |
    #     directory:
    #       include: storm.yaml
    # {{- else if eq $.Values.groupName "resources" }}
    # extraSourceFields: |
    #     directory:
    #       include: phoenix.yaml
    # {{- end }}
  {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Values.clusterName }}
  syncPolicy:
    automated:
      selfHeal: true
      enabled: {{ $.Values.enableAutoSync }}
      {{- if eq $.Values.decomission true }}
        prune: true
      {{- else }}
        prune: {{ $.Values.autoSyncPrune }}
      {{- end}}
    syncOptions:
      - CreateNamespace=true
      # - PreserveResourcesOnDeletion=true
---